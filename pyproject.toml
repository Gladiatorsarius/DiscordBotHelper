[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "discordbothelper"
version = "1.0.1"
description = "Run and restart a Python Discord bot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
DiscordBotHelper = "discordbothelper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/discordbothelper"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$version"
update_changelog_on_bump = true